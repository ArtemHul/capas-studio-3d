.sticker.down{transform:rotate(-12deg) scale(0.9)}
.cta{display:inline-block;margin-top:28px;font-family:var(--f-black);font-size:28px;letter-spacing:0.04em;text-decoration:none;background:var(--k);color:var(--y);padding:12px 24px;border:3px solid var(--k);box-shadow:6px 6px 0 rgba(255,255,255,.55)}

@keyframes run{to{transform:translateX(-50%)}}

section{padding:56px 0;scroll-margin-top:64px}
h2{font-family:var(--f-black);font-weight:400;font-size:clamp(64px,14vw,130px);line-height:0.85;letter-spacing:0.01em;margin-bottom:24px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px}
.card{background:var(--w);border:3px solid var(--k);box-shadow:var(--shadow);display:flex;flex-direction:column}

.card ul{list-style:none;font-size:16px}
.card li{padding-left:16px;position:relative}

function detectLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && SUPPORTED.includes(q)) return q;
  for (const l of (navigator.languages || [navigator.language || "es"])) {
    const code = l.slice(0, 2).toLowerCase();
    if (SUPPORTED.includes(code)) return code;
  }
  return "es";
}

function waLink(text) {
  if (!CONFIG.whatsapp) return "#";

        <h3>${name}</h3>
        <ul>${m.facts[lang].map(f => `<li>${f}</li>`).join("")}</ul>
        <div class="row">
          <span class="price">${m.price} €</span>
          <a class="want clac wa" href="${waLink(t.msgItem(name, m.price))}">${t.want}</a>
        </div>
      </div>`;
    grid.appendChild(card);
  }
}

function applyLang() {
  const t = UI[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  document.querySelector('meta[name="description"]').content = t.desc;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t[el.dataset.i]; });
  document.querySelectorAll("[data-i-aria]").forEach(el => { el.setAttribute("aria-label", t[el.dataset.iAria]); });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.getElementById("belt").textContent = t.belt.repeat(8);
  const hero = document.querySelector(".cta");
  hero.href = waLink(t[hero.dataset.msgkey]);
  renderModels();
  for (const a of document.querySelectorAll("a.wa")) {
    if (CONFIG.whatsapp) { a.target = "_blank"; a.rel = "noopener"; }
  }
  paintSound();
}

document.querySelectorAll(".langs button").forEach(b => {
  b.addEventListener("click", () => {
    lang = b.dataset.lang;
    const url = new URL(location.href);
    url.searchParams.set("lang", lang);
    history.replaceState(null, "", url);
    applyLang();
  });
});

if (CONFIG.instagram) {
  document.getElementById("ig").innerHTML =
    `Instagram: <a href="https://instagram.com/${CONFIG.instagram}" target="_blank" rel="noopener">@${CONFIG.instagram}</a>`;
}

let soundOn = true;
try { soundOn = localStorage.getItem("capas-sound") !== "off"; } catch (e) {}
const soundBtn = document.getElementById("sound");
function paintSound() {
  soundBtn.textContent = soundOn ? UI[lang].soundOn : UI[lang].soundOff;
  soundBtn.setAttribute("aria-pressed", String(soundOn));
}

let ctx = null;
function clac() {
  if (!soundOn) return;
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  const t = ctx.currentTime;
  const len = Math.floor(ctx.sampleRate * 0.03);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 6);
  const noise = ctx.createBufferSource();
  noise.buffer = buf;
  const hp = ctx.createBiquadFilter();
  hp.type = "highpass"; hp.frequency.value = 2500;
  const nGain = ctx.createGain(); nGain.gain.value = 0.9;
  noise.connect(hp).connect(nGain).connect(ctx.destination);
  const osc = ctx.createOscillator();
  const oGain = ctx.createGain();
  osc.frequency.setValueAtTime(190, t);
  osc.frequency.exponentialRampToValueAtTime(55, t + 0.06);
  oGain.gain.setValueAtTime(0.6, t);
  oGain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
  osc.connect(oGain).connect(ctx.destination);
  noise.start(t); osc.start(t); osc.stop(t + 0.08);
}

document.addEventListener("pointerdown", e => {
  const el = e.target.closest(".clac");
  if (!el) return;
  el.classList.add("down");
  clac();
});
const release = () => document.querySelectorAll(".clac.down").forEach(el => el.classList.remove("down"));
document.addEventListener("pointerup", release);
document.addEventListener("pointercancel", release);
document.addEventListener("pointerleave", release);

soundBtn.addEventListener("click", () => {
  soundOn = !soundOn;
  try { localStorage.setItem("capas-sound", soundOn ? "on" : "off"); } catch (e) {}
  paintSound();
});

applyLang();
</script>
</body>
</html>
