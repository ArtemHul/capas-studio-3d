<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capas Studio 3D · Pitilleras impresas en 3D en Alicante</title>
<meta name="description" content="Pitilleras y estuches con imán, diseñados e impresos capa a capa en Alicante. Pide el tuyo por WhatsApp.">
<meta property="og:title" content="Capas Studio 3D">
<meta property="og:description" content="Pitilleras y estuches con imán, hechos en Alicante.">
<meta name="theme-color" content="#141312">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23141312'/%3E%3Crect x='6' y='9' width='20' height='3' fill='%23FF6A2B'/%3E%3Crect x='6' y='15' width='20' height='3' fill='%23EEE8DD'/%3E%3Crect x='6' y='21' width='20' height='3' fill='%23EEE8DD'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/BebasNeue.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="css/main.css">
<script>document.documentElement.classList.add("js");</script>
</head>
<body>

<div class="preloader" aria-hidden="true">
  <div class="pl-lines"></div>
  <div class="pl-word">CAPAS</div>
  <div class="pl-meta"><span data-i="printing"></span> · <span data-i="layer"></span> <span class="pl-count">000</span>/240</div>
</div>

<header class="hdr">
  <a class="logo" href="#top">CAPAS<span> STUDIO 3D</span></a>
  <nav class="langs" aria-label="Idioma / Language">
    <button type="button" data-lang="es" aria-pressed="true" lang="es">ES</button>
    <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
    <button type="button" data-lang="uk" aria-pressed="false" lang="uk">UA</button>
    <button type="button" data-lang="ru" aria-pressed="false" lang="ru">RU</button>
  </nav>
  <button class="sound clac" id="sound" type="button" aria-pressed="true"></button>
</header>

<div class="cursor" aria-hidden="true"><span class="cursor-label"></span></div>

<div id="smooth-wrapper">
<div id="smooth-content">
<main id="top">

  <section class="hero">
    <canvas class="filament" aria-hidden="true"></canvas>
    <div class="hero-inner">
      <h1 class="hero-title" aria-label="Capas">CAPAS</h1>
      <div class="hero-sub">studio 3D · Alicante</div>
      <p class="hero-lead reveal-lines" data-i="lead"></p>
      <div class="hero-actions">
        <a class="cta clac wa" data-msgkey="msgHero" data-i="cta" href="#"></a>
        <button class="sticker clac" type="button" data-i-aria="sticker">¡CLAC!</button>
      </div>
    </div>
    <div class="scroll-hint"><span data-i="scrollHint"></span><i></i></div>
  </section>

  <section class="manifesto-sec">
    <p class="manifesto" data-i="manifesto"></p>
  </section>

  <div class="belt" aria-hidden="true"><span id="belt"></span></div>

  <section class="models" id="modelos">
    <div class="models-head">
      <h2 class="sec-title reveal-lines" data-i="models"></h2>
      <div class="models-meta"><span class="models-n">07</span> <span data-i="modelsCount"></span></div>
    </div>
    <div class="hs">
      <div class="track" id="grid"></div>
    </div>
  </section>

  <section class="how" id="pedir">
    <h2 class="sec-title reveal-lines" data-i="howTitle"></h2>
    <ol class="steps">
      <li class="step"><b>01</b><p class="reveal-lines" data-i="step1"></p></li>
      <li class="step"><b>02</b><p class="reveal-lines" data-i="step2"></p></li>
      <li class="step"><b>03</b><p class="reveal-lines" data-i="step3"></p></li>
    </ol>
  </section>

  <section class="details" id="detalles">
    <h2 class="sec-title reveal-lines" data-i="detailsTitle"></h2>
    <div class="facts">
      <div class="fact"><b>PETG</b><span data-i="fPetg"></span></div>
      <div class="fact"><b data-i="fMagT"></b><span data-i="fMag"></span></div>
      <div class="fact"><b data-i="fHandT"></b><span data-i="fHand"></span></div>
      <div class="fact"><b data-i="fCustT"></b><span data-i="fCust"></span></div>
    </div>
  </section>

  <footer class="ftr">
    <a class="cta clac wa" data-msgkey="msgHero" data-i="cta" href="#"></a>
    <div class="ftr-big" aria-label="Capas Studio 3D">CAPAS STUDIO 3D</div>
    <p><span data-i="footer"></span> <span id="ig"></span></p>
    <p data-i="adults"></p>
  </footer>

</main>
</div>
</div>

<div class="pd" id="pd" role="dialog" aria-modal="true" aria-labelledby="pd-name" hidden>
  <button class="pd-close clac" type="button" data-i="close"></button>
  <div class="pd-gallery">
    <div class="pd-viewport"><div class="pd-track"></div></div>
    <div class="pd-nav">
      <button class="pd-prev" type="button" data-i-aria="prev">←</button>
      <span class="pd-count"></span>
      <button class="pd-next" type="button" data-i-aria="next">→</button>
      <span class="pd-drag" data-i="dragHint"></span>
    </div>
  </div>
  <div class="pd-info">
    <span class="pd-idx"></span>
    <h3 class="pd-name" id="pd-name"></h3>
    <ul class="pd-facts"></ul>
    <div class="pd-row"><span class="pd-price"></span><a class="want clac wa pd-want" href="#"></a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollSmoother.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Flip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Draggable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/InertiaPlugin.min.js"></script>
<script src="js/data.js"></script>
<script src="js/filament.js"></script>
<script src="js/app.js"></script>
</body>
</html>
